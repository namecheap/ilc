name: CI

on:
    push:
        branches:
            - develop
    workflow_dispatch:
    pull_request:

# Read-only token by default, jobs that write ask for more
permissions:
    contents: read

# A new commit cancels the runs of the previous commit of the same branch or pull request.
# Every run on the default branch has its own group, so every commit there is built and published.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    common_checks:
        name: Common checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              # Only the root project, it has prettier
              run: pnpm install --frozen-lockfile --ignore-scripts --filter ilc-monorepo

            - name: Check formatting
              run: pnpm format:check

    build_ilc:
        name: Build ILC
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                branch:
                    - name: src
                      ref: ${{ github.ref }}
                    - name: dest
                      ref: ${{ github.base_ref }}
                exclude:
                    - branch:
                          ref: ''

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ matrix.branch.ref }}

            - run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            # Every branch gets its own build cache, so builds of other branches do not evict it.
            # The dest build of a pull request only reads the cache of the base branch and never overwrites it.
            - name: Calculate build cache tag
              env:
                  CACHE_BRANCH: ${{ matrix.branch.name == 'src' && (github.head_ref || github.ref_name) || github.base_ref }}
              run: echo "CACHE_TAG=buildcache_ilc_$(printf "%s" "$CACHE_BRANCH" | tr -c 'a-zA-Z0-9_.-' '_' | cut -c 1-100)" >> $GITHUB_ENV

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker ILC auth
              uses: docker/login-action@v3
              with:
                  username: brothers
                  password: ${{ secrets.DOCKER_HUB_BROTHERS_TOKEN }}

            - name: Build the Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./ilc/Dockerfile
                  platforms: linux/amd64
                  push: true
                  cache-from: |
                      type=registry,ref=namecheap/ilc_tmp:${{ env.CACHE_TAG }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache_ilc_${{ github.event.repository.default_branch }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache
                  cache-to: ${{ matrix.branch.name == 'src' && format('type=registry,ref=namecheap/ilc_tmp:{0},mode=max', env.CACHE_TAG) || '' }}
                  tags: |
                      namecheap/ilc_tmp:${{ env.SHA }}

            - name: Run server-side tests with coverage
              run: docker run --volume $(pwd)/artifacts/ilc/coverage/server:/.coverage namecheap/ilc_tmp:$SHA bash -c "pnpm test:coverage --forbid-only && mv .nyc_output/* /.coverage"

            - uses: actions/upload-artifact@v6
              with:
                  name: ${{ matrix.branch.name }}-server-side-tests-artifacts
                  path: artifacts/ilc/coverage/server

            - name: Build the Docker image to test client-side
              working-directory: ilc
              run: docker build . --file ./Test.Dockerfile --tag ilc:tmp-test-client --build-arg BASE_IMAGE=namecheap/ilc_tmp:$SHA

            - name: Run client-side tests
              run: docker run --volume $(pwd)/artifacts/ilc/coverage/client:/codebase/.karma_output/coverage ilc:tmp-test-client

            - uses: actions/upload-artifact@v6
              with:
                  name: ${{ matrix.branch.name }}-client-side-tests-artifacts
                  path: artifacts/ilc/coverage/client

    # arm64 is built on a native arm64 runner: under QEMU emulation the dependencies installation could crash with "Illegal instruction"
    # and hang the job. The amd64 and arm64 images are joined into one multi-arch image for pushes only.
    build_ilc_arm64:
        name: Build ILC (arm64)
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6

            - run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Calculate build cache tag
              env:
                  CACHE_BRANCH: ${{ github.head_ref || github.ref_name }}
              run: echo "CACHE_TAG=buildcache_ilc_arm64_$(printf "%s" "$CACHE_BRANCH" | tr -c 'a-zA-Z0-9_.-' '_' | cut -c 1-100)" >> $GITHUB_ENV

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker registry auth
              uses: docker/login-action@v3
              with:
                  username: brothers
                  password: ${{ secrets.DOCKER_HUB_BROTHERS_TOKEN }}

            - name: Build the Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./ilc/Dockerfile
                  platforms: linux/arm64
                  push: true
                  cache-from: |
                      type=registry,ref=namecheap/ilc_tmp:${{ env.CACHE_TAG }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache_ilc_arm64_${{ github.event.repository.default_branch }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache_ilc_${{ github.event.repository.default_branch }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache
                  cache-to: type=registry,ref=namecheap/ilc_tmp:${{ env.CACHE_TAG }},mode=max
                  tags: |
                      namecheap/ilc_tmp:${{ env.SHA }}-arm64

            - name: Run server-side tests
              run: docker run namecheap/ilc_tmp:$SHA-arm64 pnpm test:ci

    create_ilc_docker_manifest:
        name: Create ILC multi-arch Docker image manifest
        needs: [build_ilc, build_ilc_arm64]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Docker registry auth
              uses: docker/login-action@v3
              with:
                  username: brothers
                  password: ${{ secrets.DOCKER_HUB_BROTHERS_TOKEN }}

            - name: Join amd64 and arm64 images
              run: |
                  SHA=${GITHUB_SHA:0:7}
                  docker buildx imagetools create --tag namecheap/ilc_tmp:$SHA namecheap/ilc_tmp:$SHA namecheap/ilc_tmp:$SHA-arm64

    build_registry:
        name: Build Registry
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                branch:
                    - name: src
                      ref: ${{ github.ref }}
                    - name: dest
                      ref: ${{ github.base_ref }}
                exclude:
                    - branch:
                          ref: ''

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ matrix.branch.ref }}

            - run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            # Same build cache rules as for the ILC image, see the Build ILC job
            - name: Calculate build cache tag
              env:
                  CACHE_BRANCH: ${{ matrix.branch.name == 'src' && (github.head_ref || github.ref_name) || github.base_ref }}
              run: echo "CACHE_TAG=buildcache_registry_$(printf "%s" "$CACHE_BRANCH" | tr -c 'a-zA-Z0-9_.-' '_' | cut -c 1-100)" >> $GITHUB_ENV

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker registry auth
              uses: docker/login-action@v3
              with:
                  username: brothers
                  password: ${{ secrets.DOCKER_HUB_BROTHERS_TOKEN }}

            - name: Build the Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./registry/Dockerfile
                  platforms: linux/amd64
                  push: true
                  cache-from: |
                      type=registry,ref=namecheap/ilc_tmp:${{ env.CACHE_TAG }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache_registry_${{ github.event.repository.default_branch }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache_registry_dest
                  cache-to: ${{ matrix.branch.name == 'src' && format('type=registry,ref=namecheap/ilc_tmp:{0},mode=max', env.CACHE_TAG) || '' }}
                  tags: |
                      namecheap/ilc_tmp:reg_${{ env.SHA }}

    build_registry_arm64:
        name: Build Registry (arm64)
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6

            - run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Calculate build cache tag
              env:
                  CACHE_BRANCH: ${{ github.head_ref || github.ref_name }}
              run: echo "CACHE_TAG=buildcache_registry_arm64_$(printf "%s" "$CACHE_BRANCH" | tr -c 'a-zA-Z0-9_.-' '_' | cut -c 1-100)" >> $GITHUB_ENV

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker registry auth
              uses: docker/login-action@v3
              with:
                  username: brothers
                  password: ${{ secrets.DOCKER_HUB_BROTHERS_TOKEN }}

            - name: Build the Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./registry/Dockerfile
                  platforms: linux/arm64
                  push: true
                  cache-from: |
                      type=registry,ref=namecheap/ilc_tmp:${{ env.CACHE_TAG }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache_registry_arm64_${{ github.event.repository.default_branch }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache_registry_${{ github.event.repository.default_branch }}
                      type=registry,ref=namecheap/ilc_tmp:buildcache_registry_dest
                  cache-to: type=registry,ref=namecheap/ilc_tmp:${{ env.CACHE_TAG }},mode=max
                  tags: |
                      namecheap/ilc_tmp:reg_${{ env.SHA }}-arm64

    create_registry_docker_manifest:
        name: Create Registry multi-arch Docker image manifest
        needs: [build_registry, build_registry_arm64]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Docker registry auth
              uses: docker/login-action@v3
              with:
                  username: brothers
                  password: ${{ secrets.DOCKER_HUB_BROTHERS_TOKEN }}

            - name: Join amd64 and arm64 images
              run: |
                  SHA=${GITHUB_SHA:0:7}
                  docker buildx imagetools create --tag namecheap/ilc_tmp:reg_$SHA namecheap/ilc_tmp:reg_$SHA namecheap/ilc_tmp:reg_$SHA-arm64

    registry_tests:
        name: Test Registry
        needs: [build_registry]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                branch:
                    - name: src
                      ref: ${{ github.ref }}
                    - name: dest
                      ref: ${{ github.base_ref }}
                exclude:
                    - branch:
                          ref: ''
        env:
            # Base branches from before SQLite and MySQL removal still read it and default to SQLite without it
            DB_CLIENT: pg
            DB_NAME: ilc_${{ matrix.branch.name }}

        services:
            postgres:
                image: postgres:15.4-alpine
                env:
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: pwd
                volumes:
                    - ${{ github.workspace }}:/usr/src/ilc
                ports:
                    - 5432:5432
                options: --name=postgres --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ matrix.branch.ref }}

            - run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Docker registry auth
              uses: docker/login-action@v3
              with:
                  username: brothers
                  password: ${{ secrets.DOCKER_HUB_BROTHERS_TOKEN }}

            - name: Run tests
              run: >-
                  bash ./registry/scripts/reset.sh;
                  docker run
                  --volume $(pwd)/artifacts/registry/coverage:/.coverage
                  --network ${{ job.container.network }}
                  -e DB_CLIENT
                  -e DB_HOST=postgres
                  -e DB_PORT=5432
                  -e DB_USER=root
                  -e DB_PASSWORD=pwd
                  -e DB_NAME
                  namecheap/ilc_tmp:reg_$SHA
                  sh -c "pnpm test:ci && mv .nyc_output/* /.coverage"

            - uses: actions/upload-artifact@v6
              with:
                  name: ${{ matrix.branch.name }}-registry-tests-artifacts
                  path: ./artifacts/registry/coverage

    e2e_tests:
        name: Run E2E tests
        runs-on: ubuntu-22.04
        timeout-minutes: 20

        services:
            postgres:
                image: postgres:15.4-alpine
                env:
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: pwd
                    POSTGRES_DB: ilc
                ports:
                    - 5432:5432
                options: --name=postgres --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

        steps:
            - uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build ILC & Registry
              run: pnpm build

            - name: Run E2E tests
              working-directory: e2e
              run: pnpm start:verbose
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: root
                  DB_PASSWORD: pwd
                  DB_NAME: ilc

            - uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: e2e-tests-artifacts
                  path: e2e/.codecept_output

    coverage_report:
        name: PR Coverage Report
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build_ilc, registry_tests]
        if: github.base_ref
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/download-artifact@v6
              with:
                  # only the coverage artifacts, not the build records docker/build-push-action uploads
                  pattern: '*-artifacts'
            - name: Create coverage report for ilc/server
              id: ilc-server-coverage-report
              uses: namecheap/Coverage-Diff@master
              with:
                  fullCoverageDiff: true
                  autorun: false
                  postComment: false
                  oldCodeCoveragePath: ./dest-server-side-tests-artifacts/coverage/coverage-summary.json
                  newCodeCoveragePath: ./src-server-side-tests-artifacts/coverage/coverage-summary.json
                  total_delta: 2.55
            - name: Create coverage report for ilc/client
              id: ilc-client-coverage-report
              if: '!cancelled()'
              uses: namecheap/Coverage-Diff@master
              with:
                  fullCoverageDiff: true
                  autorun: false
                  postComment: false
                  oldCodeCoveragePath: ./dest-client-side-tests-artifacts/coverage-summary.json
                  newCodeCoveragePath: ./src-client-side-tests-artifacts/coverage-summary.json
                  total_delta: 10
            - name: Create coverage report for registry
              id: registry-coverage-report
              if: '!cancelled()'
              uses: namecheap/Coverage-Diff@master
              with:
                  fullCoverageDiff: true
                  autorun: false
                  postComment: false
                  oldCodeCoveragePath: ./dest-registry-tests-artifacts/coverage/coverage-summary.json
                  newCodeCoveragePath: ./src-registry-tests-artifacts/coverage/coverage-summary.json
                  total_delta: 2
            - name: Compose comment
              if: '!cancelled()'
              # Reports contain file names from the pull request, so they go through env and not into the script
              env:
                  ILC_SERVER_REPORT: ${{ steps.ilc-server-coverage-report.outputs.report }}
                  ILC_CLIENT_REPORT: ${{ steps.ilc-client-coverage-report.outputs.report }}
                  REGISTRY_REPORT: ${{ steps.registry-coverage-report.outputs.report }}
              run: |
                  {
                      echo "# Coverage Report"
                      echo "## Ilc/server"
                      echo "$ILC_SERVER_REPORT"
                      echo "## Ilc/client"
                      echo "$ILC_CLIENT_REPORT"
                      echo "## Registry"
                      echo "$REGISTRY_REPORT"
                  } > report.md
            - name: Add Coverage PR Comment
              if: '!cancelled()'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  recreate: true
                  header: coverage-diff-report
                  path: report.md

    push_images:
        needs: [build_ilc, registry_tests, e2e_tests, create_ilc_docker_manifest, create_registry_docker_manifest]
        name: Push images to registry
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # Pull request runs must not publish to the public namecheap/ilc and namecheap/ilc_registry
        if: github.event_name == 'push'
        steps:
            - name: Docker registry auth
              uses: docker/login-action@v3
              with:
                  username: brothers
                  password: ${{ secrets.DOCKER_HUB_BROTHERS_TOKEN }}

            - name: Calculate tags
              id: tags
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  BRANCH=$(echo ${GITHUB_REF} | cut -d '/' -f 3-99)
                  # The commit SHA tag is what release.yml re-tags with the version
                  SHA_TAG=$([ "$BRANCH" == "$DEFAULT_BRANCH" ] && echo "${GITHUB_SHA:0:7}," || echo "")
                  DOCKER_TAGS="$SHA_TAG${BRANCH//\//_}"
                  echo "Tags that will be used: $DOCKER_TAGS"
                  echo "docker_tags=$DOCKER_TAGS" >> $GITHUB_OUTPUT

            - name: Push images
              env:
                  TAGS: ${{ steps.tags.outputs.docker_tags }}
              run: |
                  for i in ${TAGS//,/ }
                  do
                      docker buildx imagetools create --tag namecheap/ilc_registry:$i namecheap/ilc_tmp:reg_${GITHUB_SHA:0:7}
                      docker buildx imagetools create --tag namecheap/ilc:$i namecheap/ilc_tmp:${GITHUB_SHA:0:7}
                  done

    build_docs:
        needs: [push_images]
        name: Build documentation
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.ref_name == github.event.repository.default_branch
        permissions:
            # mkdocs gh-deploy pushes to the gh-pages branch
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: 3.x
            - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
            - uses: actions/cache@v5
              with:
                  key: mkdocs-material-${{ env.cache_id }}
                  path: ~/.cache
                  restore-keys: |
                      mkdocs-material-
            - run: pip3 install mkdocs-material mkdocs-macros-plugin
            - run: mkdocs gh-deploy --force
