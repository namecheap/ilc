<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title></title>

        <!-- TailorX: Ignore during parsing START -->
        <!-- Shared stylesheets -->
        <style>
            body {
                margin: 0px;
                --primary: #011627;
                --background: #182b3a;
                --white: #fdfffc;
                --black: #171817;
                --gray: #8b8c8a;
                --blue: #2ec4b6;
                --red: #e71d36;
                --orange: #ff9f1c;
                --white-overlay: rgba(253, 255, 252, 0.8);
                background-color: var(--background);
                font-family: 'Roboto', sans-serif;
                color: var(--white);
                --navbar-height: 60px;
            }

            .brand-button {
                background-color: var(--orange);
                color: var(--white);
                border-style: none;
                text-align: center;
                cursor: pointer;
                padding: 8px;
                text-size: 100%;
            }

            .brand-button:disabled {
                background-color: var(--primary);
                cursor: not-allowed;
                color: var(--gray);
            }

            .brand-link {
                text-decoration: none;
                color: var(--blue);
            }

            .brand-link:visited {
                color: var(--orange);
            }

            .margin-bottom-16 {
                margin-bottom: 16px;
            }
        </style>
        <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" />
        <!-- TailorX: Ignore during parsing END -->
    </head>
    <body>
        <ilc-slot id="navbar" />
        <ilc-slot id="stack" />
    </body>
</html>
